<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Playing Cards</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>


    <main id="playing-cards">
        
        <!-- Card 2 -->
        <div class="card">
            <div class="left">A<br>♠</div>
            <div class="middle">
                <span>♠</span>
            </div>
            <div class="right">A<br>♠</div>
        </div>

        <!-- Card 2 -->
        <div class="card red">
            <div class="left">K<br>♥</div>
            <div class="middle">
                <span>♥</span>
            </div>
            <div class="right">K<br>♥</div>
        </div>

        <!-- Card 3 -->
        <div class="card red">
            <div class="left">Q<br>♦</div>
            <div class="middle">
                <span>♦</span>
            </div>
            <div class="right">Q<br>♦</div>
        </div>

        <!-- Card 4 -->
        <div class="card">
            <div class="left">J<br>♣</div>
            <div class="middle">
                <span>♣</span>
            </div>
            <div class="right">J<br>♣</div>
        </div>

    </main>

</body>
</html>
